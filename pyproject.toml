[project]
name = "meraki-tools"
version = "0.2.0"
description = "Command-line tools for automating and reporting on Cisco Meraki switch and wireless networks."
authors = [{ name = "David" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "meraki>=4.7.0",
    "matplotlib>=3.10",
]

[project.scripts]
meraki-tools = "meraki_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
]
# Only needed for the exploratory notebook in notebooks/.
notebook = [
    "pandas>=3.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meraki_tools"]

# ---------------------------------------------------------------------------
# Ruff: linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "SIM",      # simplifications
    "D",        # docstrings
    "PL",       # pylint subset
    "RUF",
]
ignore = [
    "D105",     # magic methods are self-explanatory
    "D107",     # __init__ is documented on the class or method
    "PLR2004",  # magic values are fine in small CLI tools
    "PLR0913",  # some helpers legitimately take many keyword options
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
"notebooks/**" = ["ALL"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "src/meraki_tools"]
addopts = ["--doctest-modules", "--import-mode=importlib"]
